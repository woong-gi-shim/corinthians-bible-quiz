<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고린도전서 성경퀴즈 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --ink:#1E2722; --muted:#5E6B63; --line:#D3DACF;
  --accent:#2F6B5A; --accent-ink:#FFFFFF; --slot:#B8892B; --slot-bg:#F6EED9;
  --ok:#2F7A4C; --ok-bg:#E3F1E7; --bad:#A93545; --bad-bg:#F8E4E6;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141A17; --surface:#1D2521; --ink:#E6ECE7; --muted:#9AA79F; --line:#33403A;
    --accent:#6FB39C; --accent-ink:#0F1613; --slot:#E0B45A; --slot-bg:#2C2718;
    --ok:#7CCB98; --ok-bg:#1C3125; --bad:#F08A97; --bad-bg:#3A1F24;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141A17; --surface:#1D2521; --ink:#E6ECE7; --muted:#9AA79F; --line:#33403A;
  --accent:#6FB39C; --accent-ink:#0F1613; --slot:#E0B45A; --slot-bg:#2C2718;
  --ok:#7CCB98; --ok-bg:#1C3125; --bad:#F08A97; --bad-bg:#3A1F24;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 40px}
h1{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.9rem;line-height:1.25;margin:18px 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;
  padding:14px 16px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.choice[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice b{font-weight:600}
.choice span{color:var(--muted);font-size:.9rem;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:10px;margin:14px 2px 20px;color:var(--muted);font-size:.95rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;font:inherit;font-weight:600;
  background:var(--accent);color:var(--accent-ink);cursor:pointer;font-size:1.02rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:500}
.btn + .btn{margin-top:10px}
.btn:focus-visible,.choice:focus-visible,input:focus-visible,.link:focus-visible{outline:3px solid var(--slot);outline-offset:2px}
.resume{margin-bottom:22px}
.resume p{margin:0 0 12px}

/* question */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.link{background:none;border:0;color:var(--muted);font:inherit;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.bar{height:4px;background:var(--line);border-radius:2px;margin:10px 0 26px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.where{font-size:.9rem;color:var(--accent);font-weight:600;margin-bottom:10px}
.round{display:inline-block;margin-left:8px;color:var(--bad);font-weight:600}
.verse{font-family:"Gowun Batang",serif;font-size:1.42rem;line-height:1.85;margin:0 0 28px;word-break:keep-all}
.slot{display:inline-block;min-width:4.2em;padding:0 .35em;margin:0 .1em;border-bottom:2.5px solid var(--slot);
  background:var(--slot-bg);border-radius:4px 4px 0 0;text-align:center;color:var(--slot);font-weight:700;line-height:1.5}
.slot.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-bg)}
.slot.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.answer{width:100%;font:inherit;font-size:1.15rem;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);color:var(--ink);margin-bottom:12px}
.answer:disabled{opacity:.7}
.fb{border-radius:12px;padding:14px 16px;margin-bottom:12px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.bad{background:var(--bad-bg);color:var(--bad)}
.fb strong{display:block;font-size:1.1rem;margin-bottom:2px}
.fb .mine{color:var(--muted);font-size:.92rem}
.fb .link{color:inherit;margin-top:6px}

/* result */
.score{font-family:"Gowun Batang",serif;font-size:3.4rem;font-weight:700;line-height:1;margin:22px 0 4px}
.score small{font-size:1.4rem;color:var(--muted);font-weight:400}
.wrong-list{list-style:none;padding:0;margin:20px 0 24px}
.wrong-list li{border-top:1px solid var(--line);padding:12px 2px;font-size:.95rem}
.wrong-list li:last-child{border-bottom:1px solid var(--line)}
.wrong-list .w{color:var(--muted);font-size:.85rem}
.wrong-list .a{color:var(--accent);font-weight:600}
.allclear{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:16px;margin:20px 0}
.hidden{display:none}
h2{font-size:1.02rem;font-weight:600;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-weight:400;color:var(--muted);font-size:.88rem}
.grid{display:grid;gap:8px}
.grid.ch{grid-template-columns:repeat(4,1fr)}
.grid.sc{grid-template-columns:repeat(2,1fr)}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 6px;font:inherit;color:inherit;
  cursor:pointer;text-align:center;line-height:1.3}
.chip.wide{grid-column:1/-1;display:flex;justify-content:space-between;padding:12px 14px}
.chip.wide span{color:var(--muted);font-size:.9rem}
.grid.sc .chip{text-align:left;padding:10px 12px}
.chip small{display:block;color:var(--muted);font-size:.8rem;margin-top:2px}
.chip[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent);font-weight:600}
.chip:focus-visible{outline:3px solid var(--slot);outline-offset:2px}
.verses{margin-top:28px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--slot);border-radius:12px;padding:16px 16px 12px}
.verses h3{font-family:"Gowun Batang",serif;font-size:1.15rem;margin:0 0 4px}
.verses p{margin:0 0 12px;color:var(--muted);font-size:.88rem}
.vgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.vrow{display:flex;gap:10px;padding:7px 4px;border-top:1px solid var(--line);font-size:.93rem}
.vrow b{min-width:2.6em;color:var(--slot);font-weight:600}
.vrow.on{background:var(--slot-bg);border-radius:6px}
.keyv{margin-top:18px;padding:12px 14px;border-left:4px solid var(--slot);background:var(--slot-bg);border-radius:8px;font-size:.92rem}
.keyv b{color:var(--slot)}
.startbar{position:sticky;bottom:0;margin:20px -18px -40px;padding:14px 18px calc(14px + env(safe-area-inset-bottom,0px));
  background:var(--bg);border-top:1px solid var(--line)}
.startbar .toggle{margin:0 2px 12px}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}}
</style>
</head>

 [5,15,'부활의 소망이 없다면 ___에서 맹수와 싸운 것이 무슨 유익이냐고 말해요.',['에베소']],
 [5,15,'부활의 소망이 없다면 에베소에서 ___와 싸운 것이 무슨 유익이냐고 말해요.',['맹수']],
 [6,16,'연보는 ___ 교회들에게 명한 것처럼 모아 두라고 했어요.',['갈라디아']],
 [6,16,'연보는 매주 ___에 모아 두라고 했어요.',['첫날','첫 날','첫째 날']],
 [6,16,'모은 연보를 ___으로 보내려 했어요.',['예루살렘']],
 [6,16,'바울은 ___를 지나 고린도로 가려 했어요.',['마게도냐']],
 [6,16,'바울은 ___까지는 에베소에 머물 계획이었어요.',['오순절']],
 [6,16,'바울은 오순절까지 ___에 머물 계획이었어요. 큰 사역의 문이 열렸기 때문이에요.',['에베소']],
 [6,16,'___의 집은 아가야의 첫 열매였어요.',['스데바나']],
 [6,16,'스데바나의 집은 ___의 첫 열매였어요.',['아가야']],
 [6,16,'스데바나와 ___, 아가이고가 찾아와 바울을 기쁘게 했어요.',['브드나도']],
 [6,16,'스데바나와 브드나도, ___가 찾아와 바울을 기쁘게 했어요.',['아가이고']],
 [6,16,'마지막으로 ___의 교회들이 문안해요.',['아시아']],
 [6,16,'___와 브리스가, 그 집에 있는 교회가 문안해요.',['아굴라']],
 [6,16,'아굴라와 ___, 그 집에 있는 교회가 문안해요.',['브리스가']]
];
const SCENES = {1:'갈라진 교회',2:'바울의 사역과 권리',3:'광야의 조상들',4:'은사와 예배의 질서',5:'부활의 증인들',6:'바울의 계획과 인사'};
const Q = [];
SUMMARY.forEach(([c,t,a],i)=>Q.push({id:'s'+i, set:'summary', ch:c, where:c+'장 요약', t, a}));
STORY.forEach(([sc,c,t,a],i)=>Q.push({id:'p'+i, set:'story', sc, ch:c, where:'장면 '+sc+' · '+SCENES[sc]+' ('+c+'장)', t, a}));
const QMAP = Object.fromEntries(Q.map(q=>[q.id,q]));
const VERSES = {1:'15, 18, 29',2:'4, 10, 14',3:'12-13, 16, 18',4:'2, 16-17, 20',5:'8, 11, 13',6:'9-10, 13, 18',
  7:'5, 23, 28',8:'1, 13',9:'4-6, 11, 19, 27',10:'8, 16, 31',11:'3, 30',12:'8-10, 15-21, 27',
  13:'4, 4-7, 13',14:'4, 20, 26',15:'9, 13, 42-44',16:'5, 13-14, 17'};
// 범위: all | summary | story | c<n> (장별 요약 n장) | sc<n> (인물·장소·숫자 장면 n)
function inSet(q,set){
  if(set==='all') return true;
  if(set==='summary'||set==='story') return q.set===set;
  if(set.startsWith('sc')) return q.set==='story' && q.sc===+set.slice(2);
  if(set.startsWith('c'))  return q.set==='summary' && q.ch===+set.slice(1);
  return false;
}
function setLabel(set){
  if(set==='all') return '전체 문제';
  if(set==='summary') return '장별 요약 빈칸 전체';
  if(set==='story') return '인물·장소·숫자 전체';
  if(set.startsWith('sc')) return '인물·장소·숫자 장면 '+set.slice(2);
  return '장별 요약 빈칸 '+set.slice(1)+'장';
}

// ── 저장 ─────────────────────────────────────────
const KEY = 'cor1-quiz-v1';
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function clearSave(){ try{ localStorage.removeItem(KEY); }catch(e){} }

let S = load();   // {set, queue, idx, round, res:{id:true/false}, answered:{id:'입력'}, everWrong:{id:n}, stage}
let pick = {set:(S&&S.set)||'all', shuffle:S?S.shuffle!==false:true};

const norm = s => s.normalize('NFC').replace(/[\s.,·~\-()"'“”‘’!?명]/g,'').toLowerCase();
const isRight = (q,input) => { const n = norm(input); return n.length>0 && q.a.some(x => norm(x)===n); };
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

const app = document.getElementById('app');
const count = set => Q.filter(q=>inSet(q,set)).length;

// ── 시작 화면 ───────────────────────────────────────
function renderHome(){
  document.onkeydown = null;
  const inProgress = S && S.stage==='quiz' && S.idx>0;
  const on = k => pick.set===k;
  const selCh = pick.set.startsWith('c') ? +pick.set.slice(1) : 0;
  const chips = [];
  for(let c=1;c<=16;c++) chips.push(`<button class="chip" data-set="c${c}" aria-pressed="${on('c'+c)}">${c}장</button>`);
  const scenes = [];
  for(let n=1;n<=6;n++) scenes.push(`<button class="chip" data-set="sc${n}" aria-pressed="${on('sc'+n)}">장면 ${n}<small>${SCENES[n]} · ${count('sc'+n)}문제</small></button>`);
  const vrows = Object.keys(VERSES).map(c=>`<div class="vrow ${selCh==+c?'on':''}"><b>${c}장</b><span>${VERSES[c]}절</span></div>`).join('');
  app.innerHTML = `
    <h1>고린도전서<br>성경퀴즈 연습</h1>
    <p class="sub">빈칸에 들어갈 말을 적고 확인하세요. 다 풀고 나면 틀린 문제만 다시 풀 수 있어요.</p>
    ${inProgress ? `<div class="panel resume">
      <p>풀던 기록이 있어요: ${setLabel(S.set)}${S.round>1?` (틀린 문제 ${S.round-1}차 복습)`:''}, ${S.idx} / ${S.queue.length}문제</p>
      <button class="btn" id="resume">이어서 풀기</button></div>` : ''}
    <button class="choice" data-set="all" aria-pressed="${on('all')}"><b>전체 문제</b><span>${count('all')}문제</span></button>

    <h2>장별 요약 빈칸</h2>
    <div class="grid ch">
      <button class="chip wide" data-set="summary" aria-pressed="${on('summary')}">1~16장 전체<span>${count('summary')}문제</span></button>
      ${chips.join('')}
    </div>

    <h2>인물·장소·숫자</h2>
    <div class="grid sc">
      <button class="chip wide" data-set="story" aria-pressed="${on('story')}">장면 1~6 전체<span>${count('story')}문제</span></button>
      ${scenes.join('')}
    </div>

    <section class="verses" aria-label="핵심 구절">
      <h3>핵심 구절</h3>
      <p>성경을 펴서 직접 찾아 읽으세요. 빈칸 문제와 암송 문제는 이 구절들에서 많이 나옵니다.</p>
      <div class="vgrid">${vrows}</div>
    </section>

    <div class="startbar">
      <label class="toggle"><input type="checkbox" id="shuf" ${pick.shuffle?'checked':''}> 문제 순서 섞기</label>
      <button class="btn" id="start">${setLabel(pick.set)} 시작하기 (${count(pick.set)}문제)</button>
    </div>`;
  app.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{pick.set=b.dataset.set;renderHome();});
  app.querySelector('#shuf').onchange = e => pick.shuffle = e.target.checked;
  app.querySelector('#start').onclick = () => {
    if(inProgress && !confirm('풀던 기록이 지워지고 새로 시작해요. 계속할까요?')) return;
    startNew();
  };
  const r = app.querySelector('#resume'); if(r) r.onclick = renderQuiz;
}
function startNew(){
  const ids = Q.filter(q=>inSet(q,pick.set)).map(q=>q.id);
  S = {set:pick.set, shuffle:pick.shuffle, queue: pick.shuffle?shuffle(ids):ids, idx:0, round:1, res:{}, answered:{}, everWrong:{}, stage:'quiz'};
  save(); renderQuiz();
}

// ── 문제 화면 ───────────────────────────────────────
function verseHTML(q, state, fill){
  const slot = state ? `<span class="slot ${state}">${esc(fill)}</span>` : `<span class="slot" aria-label="빈칸">&nbsp;?&nbsp;</span>`;
  return esc(q.t).replace('___', slot);
}
function renderQuiz(){
  if(S.idx >= S.queue.length){ finishRound(); return; }
  const q = QMAP[S.queue[S.idx]];
  const done = q.id in S.res;
  const total = S.queue.length;
  const pct = ((S.idx + (done?1:0)) / total) * 100;
  app.innerHTML = `
    <div class="top"><span>${S.idx+1} / ${total}${S.round>1?`<span class="round">틀린 문제 ${S.round-1}차 복습</span>`:''}</span>
      <button class="link" id="home">처음 화면</button></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    <div class="where">${q.where}</div>
    <p class="verse" id="verse">${done ? verseHTML(q, S.res[q.id]?'ok':'bad', q.a[0]) : verseHTML(q)}</p>
    <input class="answer" id="ans" type="text" autocomplete="off" autocapitalize="off" enterkeyhint="done"
      placeholder="빈칸에 들어갈 말" aria-label="정답 입력" ${done?'disabled':''} value="${done?esc(S.answered[q.id]||''):''}">
    <div id="fb"></div>
    <button class="btn" id="go">${done?'다음 문제':'확인'}</button>
    <div class="keyv"><b>${q.ch}장 핵심 구절</b> ${VERSES[q.ch]}절</div>`;
  app.querySelector('#home').onclick = renderHome;
  const inp = app.querySelector('#ans'), go = app.querySelector('#go');
  if(done) showFeedback(q); else setTimeout(()=>inp.focus(), 50);
  const act = () => { if(q.id in S.res){ S.idx++; save(); renderQuiz(); } else check(q); };
  go.onclick = act;
  inp.onkeydown = e => { if(e.key==='Enter' && !e.isComposing){ e.preventDefault(); act(); } };
  document.onkeydown = e => { if(e.key==='Enter' && (q.id in S.res) && document.activeElement!==inp){ e.preventDefault(); act(); } };
}
function check(q){
  const inp = app.querySelector('#ans');
  const v = inp.value.trim();
  if(!v){ inp.focus(); return; }
  const ok = isRight(q, v);
  S.res[q.id] = ok; S.answered[q.id] = v;
  if(!ok) S.everWrong[q.id] = (S.everWrong[q.id]||0)+1;
  save(); renderQuiz();
}
function showFeedback(q){
  const ok = S.res[q.id];
  const alt = q.a.length>1 ? ` <span class="mine">(인정: ${q.a.slice(1).map(esc).join(', ')})</span>` : '';
  const fb = app.querySelector('#fb');
  fb.innerHTML = ok
    ? `<div class="fb ok"><strong>맞았어요</strong>정답: ${esc(q.a[0])}${alt}</div>`
    : `<div class="fb bad"><strong>틀렸어요</strong>정답: ${esc(q.a[0])}${alt}
        <div class="mine">내가 쓴 답: ${esc(S.answered[q.id]||'')}</div>
        <button class="link" id="override">오타라서 맞은 걸로 할게요</button></div>`;
  const o = fb.querySelector('#override');
  if(o) o.onclick = () => {
    S.res[q.id] = true;
    S.everWrong[q.id] = Math.max(0,(S.everWrong[q.id]||1)-1);
    save(); renderQuiz();
  };
  app.querySelector('#go').focus();
}

// ── 결과 화면 ───────────────────────────────────────
function finishRound(){
  document.onkeydown = null;
  const wrong = S.queue.filter(id=>!S.res[id]);
  const right = S.queue.length - wrong.length;
  S.stage = 'result'; save();
  app.innerHTML = `
    <div class="top"><span>${setLabel(S.set)} ${S.round===1?'결과':`틀린 문제 ${S.round-1}차 복습 결과`}</span>
      <button class="link" id="home">처음 화면</button></div>
    <div class="score">${right}<small> / ${S.queue.length}</small></div>
    <p class="sub">${wrong.length ? `${wrong.length}문제를 틀렸어요.` : '모두 맞혔어요.'}</p>
    ${wrong.length ? `
      <button class="btn" id="retry">틀린 ${wrong.length}문제 다시 풀기</button>
      <ul class="wrong-list">${wrong.map(id=>{const q=QMAP[id];return `<li>
        <div class="w">${q.where}</div>
        ${esc(q.t).replace('___', `<span class="a">${esc(q.a[0])}</span>`)}
        <div class="w">내가 쓴 답: ${esc(S.answered[id]||'')}</div></li>`}).join('')}</ul>`
    : `<div class="allclear">${S.round>1?'틀렸던 문제까지 모두 맞혔어요. 이제 전체 범위를 한 번 더 풀어 보세요.':'처음부터 끝까지 전부 맞혔어요.'}</div>`}
    <button class="btn ghost" id="again">${setLabel(S.set)} 처음부터 다시 풀기</button>`;
  app.querySelector('#home').onclick = renderHome;
  app.querySelector('#again').onclick = () => { pick.set = S.set; pick.shuffle = S.shuffle; startNew(); };
  const r = app.querySelector('#retry');
  if(r) r.onclick = () => {
    S.queue = S.shuffle ? shuffle(wrong) : wrong;
    S.idx = 0; S.round++; S.res = {}; S.answered = {}; S.stage = 'quiz';
    save(); renderQuiz();
  };
  window.scrollTo(0,0);
}

// ── 시작 ─────────────────────────────────────────
if(S && S.stage==='result') finishRound(); else renderHome();
</script>
</body>
</html>
